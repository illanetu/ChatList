# Сборка ChatList и публикация в GitHub Release при создании тега v*
# Использование: обновите version.py, затем git tag v1.0.0 && git push origin v1.0.0

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
        shell: pwsh

      - name: Build executable
        run: .\build.ps1
        shell: pwsh

      - name: Build installer
        run: .\install.ps1
        shell: pwsh
        env:
          ISCC_PATH: "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Get version
        id: version
        run: |
          $v = (python -c "import version; print(version.__version__)").Trim()
          echo "VERSION=$v" >> $env:GITHUB_ENV
          echo "version=$v" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ChatList-${{ env.VERSION }}.exe
            install/ChatList-${{ env.VERSION }}-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
